# =====================================================================
# File        : charts/tasktracker/templates/serviceaccount.yaml
# Assignment  : DSO202 Assignment 4 (from Assignment 2, 02-rbac.yaml)
# Descriptor  : Unit II 2.3 - ServiceAccounts
# Purpose     : Identity for the Task Tracker Pods. No Role is bound to it
#               and its token is not mounted. Roles and RoleBindings are
#               platform objects (C8) and live in platform/<env>/rbac.yaml.
# =====================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "tasktracker.labels" (dict "root" . "tier" "identity") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
