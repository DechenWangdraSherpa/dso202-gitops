# =====================================================================
# File        : charts/tasktracker/templates/configmap.yaml
# Assignment  : DSO202 Assignment 4 (from Assignment 3)
# Descriptor  : Unit I 1.5.3 - ConfigMaps
# Purpose     : Non-secret settings shared by the three tiers. Credentials
#               are NOT here: they come from the existing Secret (C3).
# =====================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    {{- include "tasktracker.labels" (dict "root" . "tier" "config") | nindent 4 }}
  annotations:
    # Wave 0, with the database: every tier reads this ConfigMap at start-up.
    argocd.argoproj.io/sync-wave: "0"
data:
  DB_HOST: {{ .Values.config.dbHost | quote }}
  DB_PORT: {{ .Values.config.dbPort | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  APP_PORT: {{ .Values.config.appPort | quote }}
  CORS_ORIGIN: {{ .Values.config.corsOrigin | quote }}
  POSTGRES_DB: {{ .Values.config.dbName | quote }}
  BACKEND_URL: {{ .Values.config.backendUrl | quote }}
