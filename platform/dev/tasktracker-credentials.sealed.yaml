# =====================================================================
# File        : platform/dev/tasktracker-credentials.sealed.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit IV 4.4 - secrets in GitOps (Sealed Secrets)
# Purpose     : The Task Tracker database credentials for dso202-dev, encrypted
#               with the public key of this cluster's Sealed Secrets controller.
#               Generated with kubeseal (Task 4, step 4); safe to commit. Only
#               the controller holding the private sealing key can decrypt it.
# Scope       : strict (default) - the name and namespace are part of what is
#               encrypted, so this file cannot be decrypted in any other
#               namespace or under any other name.
# Keys        : DB_USER, DB_PASSWORD, POSTGRES_USER, POSTGRES_PASSWORD
#               (DB_* and POSTGRES_* carry matching values, as in Assignment 1)
# =====================================================================
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tasktracker-credentials
  namespace: dso202-dev
spec:
  encryptedData:
    DB_PASSWORD: 
    DB_USER: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: tasktracker-credentials
      namespace: dso202-dev
