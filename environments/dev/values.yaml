# =====================================================================
# File        : environments/dev/values.yaml
# Assignment  : DSO202 Assignment 4
# Descriptor  : Unit III 3.2 - values per environment; Unit IV 4.3.1
# Purpose     : Everything that differs in dev from charts/tasktracker/values.yaml.
#               Dev follows branch main; NodePort 30080 is mapped to the host by cluster/kind-cluster.yaml.
# =====================================================================
environment: dev

# C3: the Secret created by the Sealed Secrets controller from
# platform/dev/tasktracker-credentials.sealed.yaml.
existingSecret: tasktracker-credentials

config:
  # The browser reaches the dev backend through
  #   kubectl port-forward -n dso202-dev svc/backend-svc 8082:8080
  backendUrl: http://localhost:8082

database:
  image:
    tag: "1.0"

backend:
  # One replica per tier conserves memory on a laptop cluster.
  replicaCount: 1
  image:
    tag: "1.1"
  # Backend 1.1 refuses to start without DB_SSLMODE (its log: "required
  # environment variable DB_SSLMODE is not set"). The in-cluster PostgreSQL
  # has no TLS, so 'disable'. Rendered by the chart from backend.env (C2).
  env:
    DB_SSLMODE: disable

frontend:
  replicaCount: 1
  image:
    tag: "1.1"
  service:
    nodePort: 30080
